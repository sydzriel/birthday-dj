<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Hari Jadi Sayang! 🎂</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #ff6b81; }
        .hero-img {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .message {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
        }
        .btn {
            background-color: #ff6b81;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday, Sayang! 🎉✨</h1>
        
        <!-- Letak gambar dia atau gambar korang di sini nanti -->
        <img src="images/gambar-hero.jpg" alt="Gambar Hari Jadi" class="hero-img" id="main-img">

        <div class="message">
            <p>Selamat hari jadi yang ke-XX! Semoga panjang umur, dimurahkan rezeki, dan sentiasa bahagia.</p>
            <p>Terima kasih sebab sentiasa ada dengan I. Website ringkas ni khas untuk U! ❤️</p>
        </div>

        <a href="#" class="btn" onclick="alert('I Love You! ❤️')">Klik Kejutan!</a>
    </div>

</body>
</html>
