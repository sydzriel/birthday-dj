<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sayang! 🎂</title>
    
    <!-- Link Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FFF5F5;
            color: #4A4A4A;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(229, 107, 111, 0.15);
        }
        h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            color: #E56B6F;
            margin-bottom: 10px;
        }
        .hero-img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            margin: 20px 0;
            object-fit: cover;
        }
        .message {
            font-size: 0.95em;
            line-height: 1.8;
            color: #666666;
            font-weight: 300;
        }
        .btn {
            background-color: #E56B6F;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 30px;
            display: inline-block;
            margin-top: 25px;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(229, 107, 111, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday, Sayangku! 🎉✨</h1>
        
        <!-- Gambar placeholder sementara -->
        <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500" alt="Gambar Hari Jadi" class="hero-img">

        <div class="message">
            <p>Selamat hari jadi yang ke-XX! Semoga panjang umur, dimurahkan rezeki, dan sentiasa bahagia.</p>
            <p>Terima kasih sebab sentiasa ada dengan I. Website ringkas ni khas untuk U! ❤️</p>
        </div>

        <a class="btn" onclick="alert('I Love You So Much! ❤️')">Klik Kejutan!</a>
    </div>

</body>
</html>
